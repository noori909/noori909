<svg width="100%" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="url(#headerGrad)"/>

  <!-- Animated wave -->
  <path fill="#0f172a" opacity="0.5">
    <animate attributeName="d" dur="3s" repeatCount="indefinite"
      values="
        M0,150 Q100,130 200,150 T400,150 T600,150 T800,150 L800,200 L0,200 Z;
        M0,150 Q100,170 200,150 T400,150 T600,150 T800,150 L800,200 L0,200 Z;
        M0,150 Q100,130 200,150 T400,150 T600,150 T800,150 L800,200 L0,200 Z
      "/>
  </path>

  <text x="400" y="100" font-family="Arial, sans-serif" font-size="54" font-weight="bold"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    NOMAN RAHIM
  </text>
</svg>